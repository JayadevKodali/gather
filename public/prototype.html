function facilityStatus(item,id){

  if(id==="toilets"){
    const counts=toiletTypes.map(([key])=>toilets[key]);

function ownerCalendar(){
  const current=calendarVenue();
  if(!current) return ownerControls("calendar")+title("Venue owner","Booking calendar")+
    card('<h2>No venues to show</h2><p class="muted">Your venues will appear here once they’re linked to your account.</p>');
  const [year, month] = state.calendarMonth.split("-").map(Number);
  const first = new Date(Date.UTC(year,month-1,1));
  const offset = (first.getUTCDay()+6)%7;
  const lastDay = new Date(Date.UTC(year,month,0)).getUTCDate();
  const monthLabel = first.toLocaleDateString("en-GB",{month:"long",year:"numeric",timeZone:"UTC"});
  const entries = calendarEntries();
  const cells = [];
  for (const day of ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"]) cells.push('<div class="calendar-weekday">'+day+'</div>');
  const total = Math.ceil((offset+lastDay)/7)*7;
  for (let cell=0; cell<total; cell++) {
    const day = cell-offset+1;
    if (day<1 || day>lastDay) {
      cells.push('<div class="calendar-outside" aria-hidden="true"></div>');
      continue;
    }
    const iso = state.calendarMonth+"-"+String(day).padStart(2,"0");
    const events = entries.filter(entry => entry.date===iso).map(calendarEvent).join("");
    cells.push('<div class="calendar-day"><span class="calendar-number">'+day+'</span>'+events+'</div>');
  }
  const options=selectOptions(ownedVenues().map(item=>[item.id,item.name]),current.id);
  const controls = '<div class="calendar-toolbar"><h2>'+monthLabel+'</h2><div class="actions">'+
    button("calendar-prev","Previous month")+button("calendar-next","Next month")+
    '</div><div><label for="calendar-venue">Demo venue</label><select id="calendar-venue">'+options+'</select></div></div>';
  const legend = '<ul class="calendar-legend"><li><span class="dot event-green"></span><span class="dot event-purple"></span>Sample bookings</li>'+
    '<li><span class="dot event-blue"></span>Planner quote or booking</li><li><span class="dot event-amber"></span>Open enquiry</li>'+
    '<li><span class="dot event-grey"></span>Manually blocked</li></ul>';
  return ownerControls("calendar")+title("Venue owner","Booking calendar",
    "Hover over or focus an event for a quick summary. Select it to open the details.")+
    '<section class="card calendar">'+controls+legend+'<div class="calendar-grid" aria-label="'+monthLabel+' booking calendar">'+
    cells.join("")+'</div></section>';
}

function readOptionalServices(form){
  const services=[];
  for(const item of form.querySelectorAll(".quote-service")){
    const nameField=item.querySelector('[name="service-name"]');
    const costField=item.querySelector('[name="service-cost"]');
    const name=nameField.value.trim();
    const cost=costField.value;
    if(!name && !cost) continue;
    if(!name || !cost){
      const missing=name ? costField : nameField;
      missing.setCustomValidity(name ? "Enter a price for this service." : "Enter a name for this service.");
      missing.reportValidity();
      return null;
    }
    services.push({name,amount:Number(cost)});
  }
  return services;

const hoursSince = (end,start) => (end-start)/3600000;

function durationLabel(hours){
  if(hours==null || !Number.isFinite(hours)) return "—";
  if(hours<1) return Math.max(0,Math.round(hours*60))+" min";
  if(hours<24) return Math.round(hours)+" hr";

function adminTable(label,headings,rows,empty){

function admin(){
  const now=Date.now();
  const inRange=at=>state.adminPeriod==="all" || (Number.isFinite(at) && at>=now-Number(state.adminPeriod)*86400000);
  const newest=(rows,key)=>rows.slice().sort((a,b)=>(b[key]||0)-(a[key]||0));
  const signUps=newest([...pilotSignUps,...state.adminSignUps].filter(entry=>inRange(entry.at)),"at");
  const briefs=newest([...pilotBriefs,...state.adminBriefs].filter(entry=>inRange(entry.at)),"at");
  const searched=briefs.filter(entry=>entry.matches!=null);
  const matched=searched.filter(entry=>entry.matches>0);
  const noMatches=searched.filter(entry=>entry.matches===0);
  const signedPlanners=signUps.filter(entry=>entry.role==="planner").length;
  const enquiries=[...pilotEnquiries,...state.requests.map(r=>({
    id:r.id,venueName:venue(r.venueId)?.name || "Venue unavailable",
    requestedAt:r.requestedAt,firstReplyAt:r.firstReplyAt,
    quoted:r.versions.length>0,waiting:!r.firstReplyAt && r.status==="pending",confirmed:r.status==="confirmed"
  }))].filter(entry=>inRange(entry.requestedAt));
  const awaiting=enquiries.filter(entry=>entry.waiting ?? !entry.firstReplyAt)
    .sort((a,b)=>(a.requestedAt||Infinity)-(b.requestedAt||Infinity));
  const quoted=enquiries.filter(entry=>entry.quoted);
  const replies=enquiries.filter(entry=>entry.firstReplyAt && entry.requestedAt)
    .map(entry=>hoursSince(entry.firstReplyAt,entry.requestedAt)).sort((a,b)=>a-b);
  const middle=Math.floor(replies.length/2);
  const median=replies.length?(replies.length%2?replies[middle]:(replies[middle-1]+replies[middle])/2):null;
  const bookings=newest([...pilotBookings,...state.bookings].filter(entry=>inRange(entry.confirmedAt)),"confirmedAt");
  const converted=enquiries.filter(entry=>entry.confirmed || pilotBookings.some(booking=>booking.pilotEnquiryId===entry.id)).length;
  const confirms=enquiries.length?Math.round(converted/enquiries.length*100)+"%":"—";
  const listings=[...pilotVenues,...state.venues.map(item=>({
    name:item.name,area:item.area,published:item.published,
    missing:!item.published?"Review listing and publish":""
  }))];
  const drafts=listings.filter(item=>!item.published);
  const live=listings.length-drafts.length;
  const briefRows=list=>list.map(item=>[activityDate(item.at),eventTypeLabel(item.type),item.area || "Any London area",
    item.matches==null?"Awaiting search":countLabel(item.matches,"venue")]);
  const briefHeadings=["Submitted","Event type","Area","Shortlist"];
  const totalBookingValue=bookings.reduce((sum,item)=>sum+pence(item.quote),0)/100;
  const totalDeposits=bookings.reduce((sum,item)=>sum+pence(item.deposit),0)/100;

  return title("Admin","Pilot activity","See whether venue supply is ready, where enquiries stall and how many bookings Gather brings in.")+
    '<div class="admin-toolbar"><p class="hint">Sample pilot data and activity from this browser. Payments are simulated.</p>'+
    '<div><label for="admin-period">Activity period</label><select id="admin-period">'+selectOptions(adminPeriods,state.adminPeriod)+
    '</select></div></div><div class="admin-panels">'+
    adminPanel("signups","Sign-ups",countLabel(signUps.length,"account"),
      adminTotals([["Planner accounts",signedPlanners],["Venue owner accounts",signUps.length-signedPlanners]])+
      adminTable("Recent sign-ups",["Date","Account type"],signUps.slice(0,8).map(entry=>[activityDate(entry.at),accountLabels[entry.role]]),"No sign-ups in this period."))+
    adminPanel("briefs","Planner briefs",countLabel(briefs.length,"brief"),
      adminTotals([["Searched",searched.length],["Awaiting search",briefs.length-searched.length]])+
      adminTable("Planner briefs",briefHeadings,briefRows(briefs),"No briefs in this period."))+
    adminPanel("matches","Matches",matched.length+" of "+searched.length+" searched briefs",
      '<p class="hint">A brief counts once when its shortlist contains at least one venue.</p>'+
      adminTable("Briefs with matches",briefHeadings,briefRows(matched),"No matched briefs in this period."))+
    adminPanel("bookings","Confirmed bookings",countLabel(bookings.length,"booking"),
      adminTotals([["Agreed booking value",pounds(totalBookingValue)],["Simulated deposits",pounds(totalDeposits)]])+
      adminTable("Confirmed bookings",["Reference","Venue","Event date","Agreed total","Deposit status"],
        bookings.map(entry=>[entry.reference,entry.venueName,dateLabel(entry.event.date),pounds(entry.quote),pounds(entry.deposit)+" · simulated paid"]),
        "No confirmed bookings in this period."))+
    adminPanel("funnel","Booking funnel",confirms+" enquiry-to-booking rate",
      adminTotals([["Briefs submitted",briefs.length],["Briefs with a match",matched.length],["Enquiries sent",enquiries.length],
        ["Enquiries quoted",quoted.length],["Confirmed bookings",bookings.length]])+
      '<p class="hint">Activity totals can include multiple enquiries from one brief. The conversion rate is the share of enquiries sent in this period that have since become bookings.</p>')+
    adminPanel("attention","Needs attention",countLabel(drafts.length,"draft")+" · "+countLabel(awaiting.length,"enquiry","enquiries")+" awaiting reply",
      '<h3>Draft listings</h3>'+adminTable("Draft listings",["Venue","Area","Next step"],
        drafts.map(entry=>[entry.name,entry.area,entry.missing]),"All demo listings are published.")+
      '<h3>Awaiting first venue reply</h3>'+adminTable("Enquiries awaiting a reply",["Enquiry","Venue","Sent","Waiting"],
        awaiting.map(entry=>[entry.id,entry.venueName,activityDate(entry.requestedAt),entry.requestedAt?durationLabel(hoursSince(now,entry.requestedAt)):"—"]),
        "No enquiries waiting for a first reply in this period.")+
      '<h3>Briefs without a suitable venue</h3>'+adminTable("Briefs without matches",briefHeadings,briefRows(noMatches),
        "Every searched brief in this period had a match."))+
    adminPanel("pilot","Pilot measures",live+" published listings",
      adminTotals([["Published listings",live],["Median first reply",durationLabel(median)],["Enquiry-to-booking rate",confirms]])+
      '<p class="hint">Listing status reflects the current inventory. Reply time uses enquiries sent in the selected period that have a recorded reply.</p>'+
      adminTable("Venue listing status",["Venue","Area","Status"],listings.map(entry=>[entry.name,entry.area,entry.published?"Published":"Draft"]),
        "No listings available."))+
    '</div>';
}

  if(a==="add-service" || a==="add-listed-extra" || a==="remove-service"){
    const form=target.form;
    const list=byId("quote-services");
    if(a!=="remove-service"){
      const item=ownedVenue(activeRequest("venue").venueId);
      const extra=a==="add-listed-extra" && pricedAmenities(item).find(entry=>entry.id===byId("listed-extra").value);
      if(a==="add-listed-extra" && !extra){byId("listed-extra").focus();return;}
      if(extra && Array.from(list.querySelectorAll('[name="service-name"]')).some(field=>field.value.trim()===extra.name)){
        byId("notice").textContent="That amenity is already on the quote.";
        return;
      }
      list.insertAdjacentHTML("beforeend",optionalServiceFields(extra||{}));
      list.lastElementChild.querySelector("input").focus();
    }else{
      target.closest(".quote-service").remove();
      form.querySelector('[data-action="add-service"]').focus();
    }
    byId("deposit").setCustomValidity("");
    updateQuoteTotal(form);
    return;
  }
  if(a==="back-to-quote") go("planner","request");
  const payable=state.role==="planner" && activeRequest("planner");
  if(a==="checkout" && quoteIsOpen(payable)){
    state.quoteMode="";
    go("planner",checkRequestDate(payable)?"checkout":"request");
  }
  if(a==="pay" && quoteIsOpen(payable)){
    const q=quoteOf(payable);
    if(target.dataset.id!==q.reference){go("planner","request");render();return;}
    if(byId("test-card").value==="decline"){
      const error=byId("payment-error");
      error.textContent="Test card declined. Choose Visa ending in 4242 and try again.";
      error.hidden=false;
      byId("test-card").focus();
      return;
    }
    if(checkRequestDate(payable)){
      const number=String(state.bookings.length+1).padStart(3,"0");
      Object.assign(payable,{status:"confirmed",reference:"GTH-"+number,bookedQuoteRef:q.reference,
        hire:q.hire,services:q.services,quote:q.quote,deposit:q.deposit});
      state.bookings.push({...payable,id:"booking-"+number,venueName:venue(payable.venueId).name,confirmedAt:Date.now()});
      for(const other of visibleRequests("planner")){
        if(other!==payable && other.venueId===payable.venueId && other.event.date===payable.event.date && other.status!=="confirmed"){
          other.status="alternative";
          other.message="Another quote was booked for this venue and date.";
        }
      }
    }
    go("planner","request");
  }
  if(a==="toggle-date"){
    const item=ownedVenue(state.ownerListingId);
    if(!item) return;
    const confirmed=booked(item.id,demoDate);
    if(confirmed) notice="This date has a confirmed booking.";
    else if(item.blocked.includes(demoDate)) item.blocked=item.blocked.filter(day=>day!==demoDate);
    else item.blocked.push(demoDate);
  }
  render();
});
function submitDemoForm(form, submitter){
  if(!form) return;
  if(form.dataset.form==="listing"){
    const invalid=form.querySelector("#owner-facilities :invalid");
    if(invalid) byId("owner-facilities").open=true;
  }
  if(!submitter?.hasAttribute("data-skip-validation") && !form.reportValidity()) return;
  notice="";
  const data=new FormData(form);
  switch(form.dataset.form){
    case "signup":
    case "signin":{
      const role=String(data.get("role"));
      const email=String(data.get("email")).trim().toLowerCase();
      const creating=form.dataset.form==="signup";
      if(!Object.hasOwn(demoProfiles,role) || (creating && role==="admin")) return;
      const profile=state.accounts[role];
      const emailField=byId("auth-email");
      if(creating && profile){
        emailField.setCustomValidity("A demo account already exists for this role. Sign in to use it.");
        emailField.reportValidity();
        return;
      }
      if(creating){
        const name=String(data.get("name")).trim();
        if(!name){
          const nameField=byId("auth-name");
          nameField.setCustomValidity("Enter a fictional name for your demo account.");
          nameField.reportValidity();
          return;
        }
        state.accounts[role]={name,email};
        state.adminSignUps.push({role,at:Date.now()});
      }else{
        const existing=profile || demoProfiles[role];
        if(email!==existing.email){
          emailField.setCustomValidity("This email doesn’t match the demo account. Try Use demo details.");
          emailField.reportValidity();
          return;
        }
        state.accounts[role]=existing;
      }
      state.signedIn[role]=true;
      openAccount(role);
      break;
    }
    case "brief":{
      state.raw=String(data.get("brief")).trim();
      const lower=state.raw.toLowerCase();
      const guests=lower.match(/\b(\d{1,4})\s+(?:people|guests|standing|seated)\b/);
      const budget=lower.match(/£\s*([\d,]+)\s*(k)?/);
      const date=lower.match(/\b\d{4}-\d{2}-\d{2}\b/);
      const hasStanding=/\bstanding\b/.test(lower);
      const hasSeating=/\b(?:seated|seating|sitting)\b/.test(lower);
      const mixed=/\bmixed(?: layout| seating)?\b/.test(lower) || (hasStanding && hasSeating);
      state.event={date:date?.[0]||"",type:eventTypes.find(([, , pattern]) => pattern.test(lower))?.[0] || "",guests:guests?Number(guests[1]):"",
        layout:mixed?"mixed":hasSeating?"seated":"standing",area:lower.includes("shoreditch")?"Shoreditch":"",
        budget:budget?Number(budget[1].replaceAll(",",""))*(budget[2]?1000:1):6000,
        facilities:/\b(?:with|needs?|requires?)\s+(?:av|audio[ -]?visual)\b/.test(lower)?{av:"essential"}:{}};
      state.currentBriefId=String(state.adminBriefs.length+1);
      state.adminBriefs.push({id:state.currentBriefId,at:Date.now(),type:state.event.type,area:state.event.area,matches:null});
      go("planner","review");
      break;
    }
    case "review":
      state.event={date:String(data.get("date")),type:String(data.get("eventType")),guests:Number(data.get("guests")),layout:String(data.get("layout")),
        area:String(data.get("area")).trim(),budget:Number(data.get("budget")),
        facilities:Object.fromEntries(facilities.map(([id])=>[id,String(data.get("want-"+id)||"")]))};
      state.shortlistSort="match";
      const brief=state.adminBriefs.find(entry=>entry.id===state.currentBriefId);
      if(brief) Object.assign(brief,{searchedAt:Date.now(),type:state.event.type,area:state.event.area,matches:matches().length});
      go("planner","shortlist");
      break;
    case "listing":{
      const item=ownedVenue(state.ownerListingId);
      if(!item) return;
      const details={};
      for(const field of ["name","area","kind"]){
        const value=String(data.get(field)).trim();
        if(!value){
          const input=form.elements.namedItem(field);
          input.setCustomValidity("Enter "+input.labels[0].textContent.toLowerCase()+".");
          input.reportValidity();
          return;
        }
        details[field]=value;
      }
      const toilets=Object.fromEntries(toiletFields.map(([id])=>{
        const value=data.get("cubicles-"+id);
        return [id,value===""?null:Number(value)];
      }));
      const counts=toiletTypes.map(([id])=>toilets[id]);
      if(counts.every(count=>count!==null) && toilets.accessible!==null &&
        toilets.accessible>counts.reduce((total,count)=>total+count,0)){
        const input=byId("cubicles-accessible");
        byId("owner-facilities").open=true;
        input.setCustomValidity("Accessible cubicles cannot exceed the total number of cubicles.");
        input.reportValidity();
        return;
      }
      const venueFacilities=Object.fromEntries(facilities.filter(([id])=>data.has("offer-"+id))
        .map(([id])=>[id,String(data.get("offer-"+id))]));
      const amenityPrices=Object.fromEntries(Object.entries(venueFacilities)
        .filter(([id,status])=>status==="yes" && Number(data.get("charge-"+id))>0)
        .map(([id])=>[id,Number(data.get("charge-"+id))]));
      Object.assign(item,{...details,standing:Number(data.get("standing")),seated:Number(data.get("seated")),
        mixed:data.get("mixed")?Number(data.get("mixed")):null,price:Number(data.get("price")),model:String(data.get("model")),
        facilities:venueFacilities,amenityPrices,toilets,accessNotes:String(data.get("access-notes")).trim(),
        equipmentNotes:String(data.get("equipment-notes")).trim(),published:data.has("published")});
      notice=item.published
        ? "Listing saved. It can appear in planner searches."
        : "Listing saved. It is hidden from planner searches.";
      break;
    }
    case "venue-response":{
      const r=activeRequest("venue");
      if(!r || !["pending","accepted","quote-question","planner-declined"].includes(r.status)) return;
      const decision=submitter?.value;
      const message=String(data.get("message")||"").trim();
      if(decision==="question"){
        if(!message){byId("message").setCustomValidity("Enter your question for the planner.");byId("message").reportValidity();return;}
        r.firstReplyAt ??= Date.now();
        r.message=message;r.status="question";
      }else if(decision==="decline"){
        r.firstReplyAt ??= Date.now();
        r.message=message || "The venue cannot take this booking.";r.status="declined";
      }else if(decision==="accept"){
        const services=readOptionalServices(form);
        if(!services) return;
        const hire=Number(data.get("hire")),deposit=Number(data.get("deposit"));
        const quote=(pence(hire)+services.reduce((total,service) => total+pence(service.amount),0))/100;
        if(pence(deposit)>pence(quote)){byId("deposit").setCustomValidity("The deposit must be no more than the total quote.");byId("deposit").reportValidity();return;}
        if(checkRequestDate(r)){
          const revision=r.versions.length+1;
          const reference="GQ-"+r.id+"-"+String(revision).padStart(2,"0");
          r.firstReplyAt ??= Date.now();
          r.versions.push({reference,revision,hire,services,quote,deposit,note:message,removed:{planner:false,venue:false}});
          state.request=r;
          r.status="accepted";
          notice=revision===1?"Quote sent to the planner.":"Revised quote sent to the planner.";
        }
        state.quoteMode="";
        break;
      }
      notice="Venue response recorded in the demo.";
      break;
    }
    case "reply":{
      const r=activeRequest("planner");
      if(r?.status!=="question") return;
      r.plannerReply=String(data.get("reply")).trim();
      r.status="pending";
      notice="Reply sent in the demo.";
      break;
    }
    case "quote-search":
      state.quoteLookup[state.role]=String(data.get("query")).trim();
      break;
    case "quote-question":
    case "quote-decline":
    case "quote-answer":{
      const owner=form.dataset.form==="quote-answer";
      const r=activeRequest(state.role);
      if(!quoteIsOpen(r) || (owner && r.status!=="quote-question")) return;
      const decline=form.dataset.form==="quote-decline";
      const message=String(data.get("message")??"").trim();
      if(!decline && !message) return;
      r.conversation.push({from:owner?"Venue owner":"Planner",reference:quoteOf(r).reference,
        message:decline?"Declined the quote."+(message?" "+message:""):message});
      r.status=owner?"accepted":decline?"planner-declined":"quote-question";
      state.quoteMode="";
      notice=owner?"Reply sent to the planner.":decline?"Quote declined.":"Question sent to the venue.";
      break;
    }
  }
  render();
}

// Handle Enter in fields without relying on a native form submission.
document.addEventListener("keydown", event => {
  if(event.key==="Escape"){
    document.querySelectorAll(".av-help").forEach(help=>{
      help.removeAttribute("data-open");
      if(help.matches(":hover,:focus-within")) help.setAttribute("data-dismissed","");
    });
  }
  if (event.key !== "Enter" || event.isComposing || event.target.tagName !== "INPUT" ||
      !event.target.matches('input:not([type="checkbox"]):not([type="date"])')) return;
  const submitter = event.target.form?.querySelector("button[data-submit]");
  if (submitter) {
    event.preventDefault();
    submitDemoForm(submitter.form, submitter);
  }
});
document.addEventListener("submit", event => {
  const form=event.target;
  if(!form.dataset.form) return;
  event.preventDefault();
  if(["signin","signup","quote-search"].includes(form.dataset.form)) submitDemoForm(form,event.submitter);
});
document.addEventListener("focusin",event=>{
  event.target.closest(".av-help")?.removeAttribute("data-dismissed");
});
document.addEventListener("pointerout",event=>{
  const help=event.target.closest(".av-help");
  if(help && !help.contains(event.relatedTarget) && !help.matches(":focus-within")) help.removeAttribute("data-dismissed");
});
document.addEventListener("change", event => {
  if(event.target.id==="auth-role"){
    const email=byId("auth-email");
    email.setCustomValidity("");
    email.value="";
    return;
  }
  const {id,value}=event.target;
  if(id==="show-removed"){
    state.showRemoved[state.role]=event.target.checked;
    render(false);
    byId(id).focus();
    return;
  }
  if(id.startsWith("offer-")){
    const key=id.slice(6), price=byId("amenity-price-"+key);
    if(price){price.hidden=value!=="yes";byId("charge-"+key).disabled=value!=="yes";}
    return;
  }
  if(id.startsWith("want-")){
    const selected=group=>Array.from(group.querySelectorAll("[name^='want-']")).filter(field=>field.value).length;
    byId("facilities-count").textContent=selected(event.target.form)+" selected";
    const group=event.target.closest(".facility-group");
    const count=selected(group);
    group.querySelector("summary small").textContent=count?count+" selected":"";
    return;
  }
  if(id==="admin-period"){
    state.adminOpen=Array.from(document.querySelectorAll(".admin-panel[open]"),details=>details.dataset.panel);
    state.adminPeriod=value;
  }
  else if(id==="shortlist-sort") state.shortlistSort=value;
  else if(id==="history-sort") state.historySort[state.role]=value;
  else if(id==="history-venue") state.historyVenue=value;
  else if(id==="calendar-venue") state.calendarVenueId=value;
  else return;
  render(false);
  byId(id).focus();
});
document.addEventListener("input",event=>{
  const field=event.target;
  field.setCustomValidity?.("");
  if(field.id.startsWith("cubicles-")) byId("cubicles-accessible").setCustomValidity("");
  if(field.form?.dataset.form!=="venue-response") return;
  if(field.matches('[name="hire"],[name="service-cost"]')){
    byId("deposit").setCustomValidity("");
    updateQuoteTotal(field.form);
  }
  if(field.closest(".quote-service")){
    for(const input of field.closest(".quote-service").querySelectorAll("input")) input.setCustomValidity("");
  }
});
render(false);
</script>
